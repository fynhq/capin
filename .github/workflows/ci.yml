name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p core-types -p core-capture -p core-compose -p core-annotate -p core-record -p core-stitch -p platform-record -p platform-ocr --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p core-types -p core-capture -p core-compose -p core-annotate -p core-record -p core-stitch -p platform-record -p platform-ocr --locked
      - name: Release build
        run: cargo build -p core-types -p core-capture -p core-compose -p core-annotate -p core-record -p core-stitch --release --locked

  platform-check:
    name: Platform check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Check platform crates
        run: cargo check -p platform-window -p platform-ocr -p platform-record -p app --locked
      - name: Clippy app
        shell: bash
        # Lint the app binary; unit tests are compiled and run by the next step.
        run: |
          set -o pipefail
          cargo clippy -p app --locked --message-format=json -- -D warnings 2>&1 | tee clippy.json
      - name: Report clippy diagnostics
        if: failure()
        shell: bash
        # Earlier steps can fail before clippy runs, so the log may not exist.
        run: |
          test -f clippy.json || exit 0
          python3 - <<'PY'
          import json
          for raw in open("clippy.json", encoding="utf-8"):
              try:
                  entry = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if entry.get("reason") != "compiler-message":
                  continue
              message = entry.get("message") or {}
              if message.get("level") not in {"error", "warning"}:
                  continue
              spans = message.get("spans") or []
              span = spans[0] if spans else {}
              file = span.get("file_name")
              line = span.get("line_start")
              col = span.get("column_start")
              text = message.get("message", "")
              if file and line:
                  print(f"::error file={file},line={line},col={col}::{text}")
              else:
                  print(f"::error::{text}")
          PY
      - name: Test app
        run: cargo test -p app --locked

  third-party:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Check notices
        run: python3 .github/scripts/check_third_party_notices.py

  public-surface:
    name: Public surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public surface
        shell: bash
        run: |
          set -euo pipefail
          range=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          args=(--repo . --tree)
          if [ -n "$range" ]; then args+=(--range "$range"); fi
          python3 .github/scripts/check_public_surface.py "${args[@]}"

  tag-surface:
    name: Tag surface
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag message
        run: python3 .github/scripts/check_public_surface.py --repo . --tree --tag "$GITHUB_REF_NAME"
