[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "capin"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
core-annotate.workspace = true
core-capture.workspace = true
core-compose.workspace = true
core-record.workspace = true
core-stitch.workspace = true
core-types.workspace = true
gpui-kit.workspace = true
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
platform-ocr.workspace = true
platform-record.workspace = true
platform-window.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = "0.9.0"
tray-icon = "0.26.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
