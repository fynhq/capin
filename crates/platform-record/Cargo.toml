[package]
name = "platform-record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
core-record.workspace = true
core-types.workspace = true
platform-capture.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
platform-window.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVBase",
    "AVMediaFormat",
    "AVVideoSettings",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
    "objc2-core-video",
    "objc2-uniform-type-identifiers",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFCGTypes",
    "objc2",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGBase",
    "CGColorSpace",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGImage",
    "CGWindow",
    "objc2",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "block2",
    "objc2",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferPool",
    "CVPixelFormatDescription",
    "CVReturn",
    "objc2",
    "objc2-core-graphics",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "SCError",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
    "objc2-uniform-type-identifiers",
] }

[lints]
workspace = true
