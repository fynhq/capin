[package]
name = "platform-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
core-capture.workspace = true
core-types.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
dispatch2 = "0.3.1"
foreign-types = "0.5.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSScreen",
    "objc2-core-foundation",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "HIServices",
    "AXError",
    "AXUIElement",
    "AXValue",
    "AXValueConstants",
    "libc",
    "objc2",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFCharacterSet",
    "CFData",
    "CFLocale",
    "CFNumber",
    "CFString",
    "objc2",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGBase",
    "CGColorSpace",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    "CGWindow",
    "objc2",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "block2",
    "objc2",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBuffer",
    "CVImageBuffer",
    "CVBase",
    "CVPixelBuffer",
    "CVPixelBufferPool",
    "CVPixelFormatDescription",
    "CVReturn",
    "objc2",
    "objc2-core-graphics",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSError",
    "NSProcessInfo",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "SCError",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
    "objc2-uniform-type-identifiers",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2.0.1"

[lints]
workspace = true
